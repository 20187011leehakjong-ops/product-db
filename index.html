<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포장 이슈 관리 시스템</title>

<style>
body{
font-family:'맑은 고딕',sans-serif;
background:#f5f6fa;
margin:0;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h1{
color:#1f4e79;
}

input,textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
box-sizing:border-box;
}

button{
background:#1f4e79;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:5px;
}

.issue{
background:#fafafa;
border-left:5px solid #1f4e79;
margin-top:10px;
padding:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>포장 이슈 관리 시스템</h1>

<div class="card">

<h2>이슈 등록</h2>

<input id="product" placeholder="제품명">

<input id="lot" placeholder="LOT 번호">

<input type="date" id="issueDate">

<input id="writer" placeholder="등록자">

<textarea id="issueContent" placeholder="이슈 내용"></textarea>

<textarea id="actionContent" placeholder="조치 내용"></textarea>

<button id="saveBtn">등록</button>

</div>

<div class="card">

<h2>검색</h2>

<input id="searchText" placeholder="제품명 또는 LOT번호">

<button id="searchBtn">검색</button>

</div>

<div id="result"></div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs
}
from
"https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAdQ2ISc6vf0fDp3xWIhSDQL9jkSk5bets",
authDomain: "packagingissuedb.firebaseapp.com",
projectId: "packagingissuedb",
storageBucket: "packagingissuedb.firebasestorage.app",
messagingSenderId: "952788297130",
appId: "1:952788297130:web:427fd82a7f1fe985b7b7d3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const saveBtn = document.getElementById("saveBtn");
const searchBtn = document.getElementById("searchBtn");

saveBtn.addEventListener("click", async () => {

const product =
document.getElementById("product").value;

const lot =
document.getElementById("lot").value;

const issueDate =
document.getElementById("issueDate").value;

const writer =
document.getElementById("writer").value;

const issueContent =
document.getElementById("issueContent").value;

const actionContent =
document.getElementById("actionContent").value;

if(!product || !lot || !issueDate){
alert("제품명, LOT번호, 발생일은 필수입니다.");
return;
}

await addDoc(collection(db,"issues"),{

product,
lot,
issueDate,
writer,
issueContent,
actionContent,
createdAt: Date.now()

});

alert("등록 완료");

document.getElementById("product").value="";
document.getElementById("lot").value="";
document.getElementById("issueDate").value="";
document.getElementById("writer").value="";
document.getElementById("issueContent").value="";
document.getElementById("actionContent").value="";

});

searchBtn.addEventListener("click", async () => {

const keyword =
document.getElementById("searchText")
.value
.toLowerCase();

const snapshot =
await getDocs(collection(db,"issues"));

let data=[];

snapshot.forEach(doc=>{
data.push(doc.data());
});

data.sort((a,b)=>
(b.createdAt||0)-(a.createdAt||0)
);

let html="";

data.forEach(item=>{

const match =

keyword === "" ||

(item.product||"")
.toLowerCase()
.includes(keyword)

||

(item.lot||"")
.toLowerCase()
.includes(keyword);

if(match){

html += `

<div class="card issue">

<b>제품명</b> : ${item.product}<br>
<b>LOT</b> : ${item.lot}<br>
<b>발생일</b> : ${item.issueDate}<br>
<b>등록자</b> : ${item.writer || "-"}<br><br>

<b>이슈내용</b><br>
${item.issueContent || ""}

<br><br>

<b>조치내용</b><br>
${item.actionContent || ""}

</div>

`;

}

});

if(html===""){
html="<div class='card'>검색 결과 없음</div>";
}

document.getElementById("result").innerHTML =
html;

});

</script>

</body>
</html>
